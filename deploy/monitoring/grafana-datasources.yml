# =============================================================================
# grafana-datasources.yml — Grafana 数据源自动配置
# =============================================================================
# 启动时自动注册数据源，无需手动配置
# =============================================================================

apiVersion: 1

datasources:
  # ── Prometheus 指标数据源 ────────────────────────
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "30s"
      httpMethod: "POST"

  # ── Loki 日志数据源 ──────────────────────────────
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: "trace_id"
          type: "regex"
          pattern: "trace_id=(\\w+)"
          url: "http://jaeger:16686/trace/$${__value.raw}"
