    model: deepseek-v4-pro
    temperature: 0.5
    thinking: false
    timeout: 90
  architect:
    model: deepseek-v4-pro
    temperature: 0.3
    thinking: true
    timeout: 120
  ux:
    model: deepseek-v4-flash
    temperature: 0.7
    thinking: false
    timeout: 90
  dba:
    model: deepseek-v4-pro
    temperature: 0.1
    thinking: true
    timeout: 300
