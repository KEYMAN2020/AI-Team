    model: deepseek-v4-pro
    temperature: 0.0
    thinking: false
    timeout: 300
  backend:
    model: deepseek-v4-pro
    temperature: 0.0
    thinking: false
    timeout: 300
  reviewer:
    model: deepseek-v4-pro
    temperature: 0.0
    thinking: true
    timeout: 120
  devops:
    model: deepseek-v4-flash
    temperature: 0.0
    thinking: false
    timeout: 300
  debug:
