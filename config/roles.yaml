# roles.yaml — 11 个角色的模型/温度/超时配置
# ================================================
# 每个 provider 下的角色独立配置。
# 角色缩写：
#   pm, product, architect, ux, dba,
#   frontend, backend, reviewer, devops, debug, tester

deepseek:
  pm:
    model: deepseek-v4-pro
    temperature: 0.3
    thinking: true
    timeout: 120
