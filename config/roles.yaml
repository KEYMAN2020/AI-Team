# roles.yaml — 角色配置覆盖层（优先于 role_registry）
# ======================================================
# 此文件可覆盖 roles/*/config.yaml 中的模型/温度/超时配置。
# 基础配置来自 role_registry（角色目录下的 config.yaml），
# 这里的设置会覆盖同名角色+provider 的配置。
# 角色缩写：
#   pm, product, architect, ux, dba,
#   frontend, backend, reviewer, devops, debug, tester

deepseek:
  pm:
    model: deepseek-v4-pro
    temperature: 0.3
    thinking: true
    timeout: 120
  product:
    model: deepseek-v4-pro
    temperature: 0.5
    thinking: false
    timeout: 300
  architect:
    model: deepseek-v4-pro
    temperature: 0.3
    thinking: true
    timeout: 120
  ux:
    model: deepseek-v4-flash
    temperature: 0.7
    thinking: false
    timeout: 300
  dba:
    model: deepseek-v4-pro
    temperature: 0.1
    thinking: true
    timeout: 300
  frontend:
    model: deepseek-v4-pro
    temperature: 0.0
    thinking: false
    timeout: 300
  backend:
    model: deepseek-v4-pro
    temperature: 0.0
    thinking: false
    timeout: 300
  reviewer:
    model: deepseek-v4-pro
    temperature: 0.0
    thinking: true
    timeout: 120
  devops:
    model: deepseek-v4-flash
    temperature: 0.0
    thinking: false
    timeout: 300
  debug:
    model: deepseek-v4-pro
    temperature: 0.0
    thinking: true
    timeout: 300
  tester:
    model: deepseek-v4-pro
    temperature: 0.0
    thinking: false
    timeout: 300

