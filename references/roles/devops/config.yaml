# 角色配置 — ai-team-everything
name: devops
description: "DevOps — CI/CD、容器化部署、基础设施即代码"
aliases:
- ops
model_config:
  any:
    model: gpt-5.5
    temperature: 0.2
    timeout: 300
    text_tool_compat: true
