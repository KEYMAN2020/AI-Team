# 角色配置 — ai-team-everything
name: tester
description: "测试工程师 — 测试用例设计、自动化测试、回归验证、集成测试"
aliases:
- qa
model_config:
  any:
    model: deepseek-v4-pro
    temperature: 0.2
    timeout: 300
    text_tool_compat: true
tools:
- file_read
- file_write
- code_run
- bash
- resource_search
kb_sections:
- source: curated
  section: project
- source: curated
  section: standards
- source: curated
  section: gotchas
- source: curated
  section: schema
- source: auto
  section: decisions
resource_categories:
- testing
- backend
codebase_context: true
schema_context: true
