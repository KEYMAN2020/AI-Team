# 角色配置 — ai-team-everything
name: reviewer
description: "代码审查员 — 代码质量、风格一致性、规范符合度、设计合理性"
aliases:
- cr
model_config:
  any:
    model: gpt-5.5
    temperature: 0.1
    timeout: 300
    text_tool_compat: true
tools:
- file_read
- resource_search
kb_sections:
- source: curated
  section: project
- source: curated
  section: standards
- source: curated
  section: gotchas
- source: auto
  section: decisions
resource_categories:
- backend
codebase_context: true
schema_context: false
