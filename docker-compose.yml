# =============================================================================
# docker-compose.yml — AI-TeaM 多 Agent 协作平台
# =============================================================================
# 用法：
#   docker compose up -d                    # 启动所有服务
#   docker compose logs -f                  # 查看日志
#   docker compose down                     # 停止所有服务
#   docker compose restart                  # 重启所有服务
# =============================================================================

version: "3.8"

services:
  # ── 主应用服务 ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AI_TEAM_VERSION: ${AI_TEAM_VERSION:-latest}
    image: ai-team:${AI_TEAM_VERSION:-latest}
    container_name: ai-team-app
    restart: unless-stopped
    ports:
      - "${AI_TEAM_PORT:-8123}:8123"
    environment:
      - AI_TEAM_HOST=0.0.0.0
      - AI_TEAM_PORT=8123
      - TZ=Asia/Shanghai
      # API Keys（从系统环境变量传入，不要写在 .env 文件中）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      # 运行环境
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # 持久化运行时数据
      - ai-team-state:/app/state
      - ai-team-outputs:/app/outputs
      - ai-team-logs:/app/logs
      # 配置文件（只读挂载，方便热更新）
      - ./config:/app/config:ro
      # 知识库（curated 由人类维护，auto 由 Agent 生成）
      - ./knowledge/curated:/app/knowledge/curated:ro
      - ai-team-knowledge-auto:/app/knowledge/auto
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8123/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ai-team-net
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ── Nginx 反向代理（可选，生产环境推荐）────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: ai-team-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ai-team-nginx-logs:/var/log/nginx
      # SSL 证书（生产环境）
      - ./deploy/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ai-team-net

  # ── Watchtower（自动更新镜像，仅生产环境）─────────
  watchtower:
    image: containrrr/watchtower:latest
    container_name: ai-team-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_LABEL_ENABLE=true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    profiles:
      - production
    networks:
      - ai-team-net

# ── 网络 ──────────────────────────────────────────────
networks:
  ai-team-net:
    name: ai-team-network
    driver: bridge

# ── 数据卷 ────────────────────────────────────────────
volumes:
  ai-team-state:
    name: ai-team-state-data
  ai-team-outputs:
    name: ai-team-outputs-data
  ai-team-logs:
    name: ai-team-logs-data
  ai-team-knowledge-auto:
    name: ai-team-knowledge-auto-data
  ai-team-nginx-logs:
    name: ai-team-nginx-logs-data