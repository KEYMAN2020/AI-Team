<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ai-team 项目门户</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      padding: 40px 24px;
      text-align: center;
      border-bottom: 1px solid #30363d;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(90deg, #58a6ff, #3fb950);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p {
      margin-top: 8px;
      color: #8b949e;
      font-size: 15px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    .section-title {
      font-size: 18px;
      font-weight: 600;
      color: #c9d1d9;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title .count {
      background: #21262d;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 13px;
      color: #8b949e;
    }
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .project-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .project-card:hover {
      border-color: #58a6ff;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(88, 166, 255, 0.15);
    }
    .project-card .icon-wrap {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 16px;
    }
    .project-card h3 {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #e6edf3;
    }
    .project-card .desc {
      font-size: 13px;
      color: #8b949e;
      line-height: 1.5;
      margin-bottom: 16px;
      min-height: 36px;
    }
    .project-card .meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      flex-wrap: wrap;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    .status-badge.online {
      background: rgba(63, 185, 80, 0.15);
      color: #3fb950;
    }
    .status-badge.offline {
      background: rgba(248, 81, 73, 0.15);
      color: #f85149;
    }
    .status-badge.file {
      background: rgba(88, 166, 255, 0.15);
      color: #58a6ff;
    }
    .status-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-badge.online .dot { background: #3fb950; }
    .status-badge.offline .dot { background: #f85149; }
    .status-badge.file .dot { background: #58a6ff; }
    .port-tag {
      color: #8b949e;
      background: #21262d;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .project-card .link-icon {
      position: absolute;
      top: 16px;
      right: 16px;
      font-size: 14px;
      color: #30363d;
      transition: color 0.2s;
    }
    .project-card:hover .link-icon {
      color: #58a6ff;
    }
    .quick-link {
      margin-top: 24px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px 24px;
    }
    .quick-link h3 {
      font-size: 15px;
      margin-bottom: 12px;
      color: #c9d1d9;
    }
    .quick-link .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .quick-link .links a {
      color: #58a6ff;
      text-decoration: none;
      font-size: 13px;
      padding: 6px 14px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .quick-link .links a:hover {
      border-color: #58a6ff;
      background: rgba(88, 166, 255, 0.1);
    }
    .footer {
      text-align: center;
      padding: 32px;
      color: #484f58;
      font-size: 13px;
      border-top: 1px solid #21262d;
      margin-top: 32px;
    }
    @media (max-width: 600px) {
      .project-grid {
        grid-template-columns: 1fr;
      }
      .header h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>ai-team 项目门户</h1>
    <p>所有 ai-team 生成项目的统一入口 · 点击卡片直达项目</p>
  </div>

  <div class="container">
    <div class="section-title">
      <span>项目列表</span>
      <span class="count" id="projectCount">0</span>
    </div>
    <div class="project-grid" id="projectGrid"></div>

    <div class="quick-link">
      <h3>ai-team 管理</h3>
      <div class="links">
        <a href="/dashboard">运行仪表盘</a>
        <a href="/health">健康检查</a>
      </div>
    </div>
  </div>

  <div class="footer">
    ai-team &bull; CherryClaw &bull; 由 Claude Code 驱动
  </div>

  <script>
    var PROJECTS = [
      {
        name: "项目计划书",
        desc: "银发活力平台 · 分阶段实施计划表（可下载编辑）",
        icon: "\u{1F4CA}",
        color: "#d29922",
        url: "/project_plan.xlsx",
        target: "_self",
        type: "file"
      },
      {
        name: "私密聊天室",
        desc: "你和朋友之间的轻量聊天工具，支持文字和图片",
        icon: "\u{1F4AC}",
        color: "#00a884",
        url: "http://124.220.16.67:8300",
        port: 8300,
        status: "online"
      },
      {
        name: "SVN 版本仓库",
        desc: "代码版本管理服务器 svn://124.220.16.67/main",
        icon: "\u{1F5C2}",
        color: "#ff6600",
        url: "svn://124.220.16.67/main",
        port: 3690,
        status: "online"
      },
      {
        name: "在线商城系统",
        desc: "完整的购物商城 HTML5 单页应用",
        icon: "\u{1F6D2}",
        color: "#e34c26",
        url: "http://124.220.16.67:5001",
        port: 5001,
        status: "online"
      },
      {
        name: "B005 银发活力平台",
        desc: "面向中老年人的线下活动社交平台 demo",
        icon: "\u{1F335}",
        color: "#2d8a4e",
        url: "http://124.220.16.67:5000",
        port: 5000,
        status: "online"
      },
      {
        name: "ai-team 仪表盘",
        desc: "11 角色 multi-agent 协作框架监控面板",
        icon: "\u{1F916}",
        color: "#1f6feb",
        url: "/dashboard",
        port: 8123,
        status: "online"
      },
      {
        name: "ai-team API",
        desc: "HTTP 服务端点，供 n8n/CherryStudio 调用",
        icon: "\u{1F310}",
        color: "#6e40c9",
        url: "/api/health",
        target: "_self",
        status: "online"
      }
    ];

    var colors = ["#1f6feb", "#2d8a4e", "#d29922", "#a371f7", "#db6d28", "#f778ba"];

    function getStatusBadge(p) {
      if (p.type === "file") {
        return '<span class="status-badge file"><span class="dot"></span> 文件</span>';
      }
      if (p.status === "online") {
        return '<span class="status-badge online"><span class="dot"></span> 运行中</span>';
      }
      return '<span class="status-badge offline"><span class="dot"></span> 已停止</span>';
    }

    function renderProjects() {
      var grid = document.getElementById("projectGrid");
      var countEl = document.getElementById("projectCount");
      countEl.textContent = PROJECTS.length;

      var html = "";
      for (var i = 0; i < PROJECTS.length; i++) {
        var p = PROJECTS[i];
        var linkTarget = p.target || "_blank";
        var iconBg = p.color || colors[i % colors.length];
        html += '<div class="project-card" onclick="openProject(' + i + ')">';
        html += '  <div class="link-icon"> ↗</div>';
        html += '  <div class="icon-wrap" style="background:' + iconBg + '20">' + p.icon + '</div>';
        html += '  <h3>' + p.name + '</h3>';
        html += '  <div class="desc">' + p.desc + '</div>';
        html += '  <div class="meta">';
        html += '    ' + getStatusBadge(p);
        if (p.port) {
          html += '    <span class="port-tag">:' + p.port + '</span>';
        }
        html += '  </div>';
        html += '</div>';
      }
      grid.innerHTML = html;
    }

    function openProject(index) {
      var p = PROJECTS[index];
      var target = p.target || "_blank";
      var url = p.url;
      if (url && url.indexOf("://") === -1) {
        url = window.location.origin + url;
      }
      window.open(url, target);
    }

    function checkPorts() {
      for (var i = 0; i < PROJECTS.length; i++) {
        (function(idx) {
          var p = PROJECTS[idx];
          if (!p.port) return;
          var checkUrl = "http://124.220.16.67:" + p.port;
          fetch(checkUrl, { method: "HEAD", mode: "no-cors" })
            .then(function() {
              PROJECTS[idx].status = "online";
              renderProjects();
            })
            .catch(function() {
              PROJECTS[idx].status = "offline";
              renderProjects();
            });
        })(i);
      }
    }

    renderProjects();
    setInterval(checkPorts, 30000);
    setTimeout(checkPorts, 2000);
  </script>
</body>
</html>
